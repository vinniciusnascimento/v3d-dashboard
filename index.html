<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/logo-v3d.webp">
    <title>V3D - Painel Administrativo</title>
</head>

<body>
    <div class="sidebar">
        <img src="assets/logo-v3d.webp" alt="Logo V3D">

        <nav>
            <a onclick="productsPage()" class="active linkProducts" href="#"><i data-lucide="package"></i>Produtos</a>
            <a onclick="ordersPage()" class="active linkOrders" href="#"><i data-lucide="clipboard-list"></i>Pedidos</a>
            <a class="active" href="https://calculadora-precos-v3d.vercel.app/"><i data-lucide="calculator"></i>Calculadora</a>
            <a class="active" href="https://site-v3d.vercel.app/"><i data-lucide="globe"></i>Site V3D</a>
        </nav>

        <button id="theme-toggle" type="button">
            <i data-lucide="moon"></i>
            <span>Modo escuro</span>
        </button>
    </div>

    <main id="content">
        <!-- Gerado no pages.js -->
        <header class="page-header">
            <div>
                <h1>Pedidos</h1>
                <p>Acompanhe os pedidos da V3D.</p>
            </div>
        </header>
    </main>
</body>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="orders.js"></script>
<script src="pages.js"></script>
<script src="app.js"></script>

</html>
