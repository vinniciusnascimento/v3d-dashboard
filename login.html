<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/assets/logo-v3d.webp">
    <title>Entrar | V3D</title>
    <script src="/auth.js" defer></script>
</head>
<body class="login-page">
    <main class="login-card" aria-labelledby="login-title">
        <img src="/assets/logo-v3d.webp" alt="V3D" class="login-logo">
        <h1 id="login-title">Entre no painel</h1>
        <form id="login-form" method="post" action="/api/auth/login">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input id="username" name="username" autocomplete="username" autocapitalize="none"
                    spellcheck="false" required maxlength="64">
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                    required maxlength="256">
            </div>
            <p id="login-status" class="auth-status" role="alert" hidden></p>
            <button class="btn-primary" type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
